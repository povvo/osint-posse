name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag, for example v0.1.0
        required: true
        type: string
      publish:
        description: Publish to PyPI after artefact verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Verify tag and package version agree
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
            echo "Release input is not an existing tag: ${RELEASE_TAG}" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")" || {
            echo "Checked-out commit does not match ${RELEASE_TAG}" >&2
            exit 1
          }
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY
      - run: python resources/dev/scripts/verify_release.py --source .
      - run: python -m build --sdist
      - run: python -m pip wheel --no-deps --wheel-dir dist dist/*.tar.gz
      - run: python resources/dev/scripts/verify_release.py --dist dist
      - name: Record distribution checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Attest distribution provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
